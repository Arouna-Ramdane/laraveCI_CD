#Deffinition des services app et db
services :
 app :
  build : . # Créer une image a partire d'un Dockerfile courant
  image : laravelapp
  entrypoint: ["/bin/bash", "/project/entrypoint.sh"]
  restart: unless-stopped
  ports:
   - "7000:8000"
  volumes:
   - ./app:/project/
  depends_on: 
   - db
 db :
  image : postgres:15
  env_file:
   - .env
   #- ./app/.env
  volumes:
   - dbdata:/var/lib/postgresql/data
  #environment :
  #- POSTGRES_USER=${DB_USERNAME}
  #- POSTGRES_DB=${DB_DATABASE}
  #- POSTGRES_PASSWORD=${DB_PASSWORD}
volumes:
 dbdata:
